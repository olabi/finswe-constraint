# v3 = v2 plus two prompt rules (mechanical literal check, issue-over-prior). v2: single agent after the public "Budget-Aware Coding Agent" notebook (matterhorn3838's
# SuperAgent lineage, credited in README). Changes from it: the three graph tools are not
# declared (that prompt forbade them anyway, while the harness still advertised them), and the
# final check deletes stray untracked files.
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
generate_content_config: !include configs/sampling.yaml
