<title id="t">Figure 2. Contrasts with 95% CIs and the noise floor</title><desc id="d">Forest plot of eight contrasts in percentage points with task-bootstrap 95% CIs. Only the primary contrast (C_know vs A_know, +15.0, CI +3.3 to +26.7) clears the 9.0 pp noise floor; its 40-call version (+10.0) has p = 0.074.</desc>
